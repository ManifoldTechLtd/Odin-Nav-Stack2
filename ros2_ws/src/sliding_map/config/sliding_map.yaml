# sliding_map parameters (ROS 2).
/sliding_map_node:
  ros__parameters:
    # Coordinate frames and topics
    map_frame: odom
    base_frame: odin1_base_link      # Sensor/head frame used for publishFakeScan
    footprint_frame: base_link       # Robot geometric center used for footprint polygon filter
    input_scan_topic: /scan
    fake_scan_topic: /scan_360
    map_topic: /sliding_map

    # Range and grid dimensions
    range_min: 0.05
    max_fake_range: 4.5              # Aligned with NeuPAN scan_range[1]
    output_points: 360
    resolution: 0.05
    width: 400
    height: 400

    # ---- Time decay ----
    cell_decay_sec: 8.0              # Blind-spot retention time (s); visible free rays clear cells immediately.
                                     # Do not set to 0: infinite retention accumulates ghost obstacles from moving objects.
    decay_check_period_sec: 0.5

    # Short-term memory for confirmed vacated dynamic footprints
    dynamic_memory_enable: true
    dynamic_decay_sec: 2.0
    dynamic_min_hold_sec: 2.0
    dynamic_input_topic: "/scan_dynamic"
    dynamic_require_vacated: true    # Apply short decay only after the dynamic target has vacated the cell
    footprint_clear_enable: false    # Optional zero-margin robot footprint clearing (default false)

    # Robot footprint self-filter (overridden from robots/<robot>/robot.yaml by ons2_bringup)
    use_footprint_polygon: true      # true = base_link rectangle; false = radial filter
    footprint_radius_m: 0.35         # Used when use_footprint_polygon=false
    footprint_length_m: 0.96
    footprint_width_m: 0.55
    footprint_margin_m: 0.10

    # Window recentering and diagnostic trace
    recenter_threshold_m: 5.0
    trace_period_sec: 5.0

    # Follow-target obstacle masking (disabled by default)
    follow_target_enable: false
    follow_target_topic: /waypoint_manager/follow_target
    dynamic_goal_topic: /waypoint_manager/dynamic_goal
    follow_stale_sec: 2.0
    follow_person_radius: 0.4
    follow_goal_radius: 0.5
