schema_version: 1
name: go2
display_name: Unitree Go2

frames:
  map: map
  odom: odom
  base: base_link
  sensor: odin1_base_link

topics:
  odom: /odin1/odometry
  scan: /scan
  scan_360: /scan_360
  cmd_vel: /cmd_vel

geometry:
  footprint:
    mode: radial
    radius: 0.35
  sensor_mount:
    parent: odin1_base_link
    child: base_link
    x: -0.30
    y: 0.0
    z: 0.0
    yaw: 0.0
  supports_strafe: true

bridge:
  common:
    cmd_vel_topic: /cmd_vel
    max_linear_vel: 0.625
    max_angular_vel: 0.875
    cmd_vel_timeout: 0.5
  ros1:
    package: unitree_control
    launch: unitree_control.launch
  native:
    network_interface: auto
    stand_on_start: true
    free_walk: true
    free_avoid: false
    state_topic: /unitree/sport_mode_state

navigation:
  inflation_radius: 0.16
  obstacle_cost_safe_distance: 0.40
  obstacle_cost_weight: 3.0
  line_of_sight_safe_distance: 0.25
  smoothing_iterations: 20
  smoothing_max_deviation_m: 0.20
  min_height: -0.1
  max_height: 0.3
  local_planner: neupan
  navigation_mode: replan_periodic
  periodic_replan_sec: 2.0

mission:
  enable_alignment: true
  angular_tolerance: 0.3491
  route_segment_enable: true
  route_segment_length_m: 10.0
  route_segment_overlap_m: 3.0

global_planner:
  backend: map_planner
  backends:
    map_planner:
      plan_service: /map_planner/plan

local_planner:
  backend: neupan
  backends:
    neupan:
      interface:
        mode: action
        path_topic: /initial_path
        scan_topic: /scan
        odom_topic: /odin1/odometry
        cmd_vel_topic: /cmd_vel
        nav_path_action: /neupan/nav_path
        stop_topic: /neupan/stop
      config: neupan/config.yaml
      planner: neupan/planner.yaml
    sru:
      interface:
        mode: goal_pose
        goal_topic: /sru/goal_pose
        cmd_vel_topic: /sru/cmd_vel
        enable_topic: /sru/cmd_vel_enable
        relay_output: /cmd_vel
        odom_topic: /odin1/odometry
      package: sru_nav_go2_ros1
      launch: sru_nav_go2.launch
