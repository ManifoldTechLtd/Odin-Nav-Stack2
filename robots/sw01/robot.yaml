schema_version: 1
name: sw01
display_name: ASTRALL SW01

frames:
  map: map
  odom: odom
  base: base_link
  sensor: odin1_base_link

topics:
  odom: /odin1/odometry
  scan: /scan
  scan_360: /scan_360
  cmd_vel: /cmd_vel

geometry:
  footprint:
    mode: polygon
    length: 0.96
    width: 0.55
    margin: 0.10
  sensor_mount:
    parent: odin1_base_link
    child: base_link
    x: -0.42
    y: 0.0
    z: 0.12
    yaw: 0.0
  supports_strafe: true

# Bridge launch arguments merge common -> native -> ros2 (later wins); package/launch only select
# the launch file. Every scalar key below becomes a sw01_cmd_vel_bridge parameter.
bridge:
  common:
    cmd_vel_topic: /cmd_vel
    max_linear_vel: 1.0
    max_angular_vel: 1.0
    cmd_vel_timeout: 0.5
  ros2:
    package: sw01_ros_control
    launch: sw01_control.launch.py
    cmd_vel_topic: /cmd_vel
    auto_enter_move_mode: false     # Never stand up / enter MOVE on its own
  native:
    control_rate: 50.0
    heartbeat_rate: 10.0
    cmd_vel_decay_window: 0.0
    sdk_timeout: 10000
    auth_timeout: 200               # [ms] Heartbeats stall while waiting; capped at 400
    move_timeout: 20
    heartbeat_timeout: 20
    request_control_authority: true
    require_move_mode: true
    publish_status: true
    require_enable: false           # Always enabled; remote-controller authority switch gates motion directly
    blocking_error_mask: 0          # errorCode bits that also block motion; sysStatus ERROR always does

navigation:
  inflation_radius: 0.35
  obstacle_cost_safe_distance: 0.50
  obstacle_cost_weight: 3.5
  dynamic_obstacle_cost_safe_distance: 0.35
  dynamic_obstacle_cost_weight: 3.2
  sliding_map_start_exempt_radius_m: 0.48
  start_heading_penalty_weight: 4.0
  start_heading_penalty_radius_m: 1.5
  path_protect_initial_m: 0.25
  line_of_sight_safe_distance: 0.20
  smoothing_iterations: 40
  smoothing_max_deviation_m: 0.35
  goal_relocate_enable: true
  goal_relocate_clearance_m: 0.55
  goal_relocate_max_radius_m: 3.5
  min_height: -0.3
  max_height: 0.3
  range_min: 0.01
  local_planner: neupan
  navigation_mode: replan_periodic
  periodic_replan_sec: 2.0

mission:
  enable_alignment: true
  angular_tolerance: 0.0873
  route_segment_enable: true
  route_segment_length_m: 10.0
  route_segment_overlap_m: 3.0

global_planner:
  backend: map_planner
  backends:
    map_planner:
      plan_service: /map_planner/plan

local_planner:
  backend: neupan
  backends:
    neupan:
      interface:
        mode: action
        path_topic: /initial_path
        scan_topic: /scan_360
        odom_topic: /odin1/odometry
        cmd_vel_topic: /cmd_vel
        nav_path_action: /neupan/nav_path
        stop_topic: /neupan/stop
      config: neupan/config.yaml
      planner: neupan/planner.yaml
    sru:
      interface:
        mode: goal_pose
        goal_topic: /sru/goal_pose
        cmd_vel_topic: /sru/cmd_vel
        enable_topic: /sru/cmd_vel_enable
        relay_output: /cmd_vel
        odom_topic: /odin1/odometry
      package: sru_nav
      launch: sru_nav.launch.py
      # Robot-specific overrides (conservative policy_scale), passed to the
      # planner launch as params_file; same pattern as neupan.config above.
      config: sru/config.yaml
