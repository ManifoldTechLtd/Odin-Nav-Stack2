schema_version: 1
name: sw01
display_name: ASTRALL SW01

frames:
  map: map
  odom: odom
  base: base_link
  sensor: odin1_base_link

topics:
  odom: /odin1/odometry
  scan: /scan
  scan_360: /scan_360
  cmd_vel: /cmd_vel

geometry:
  footprint:
    mode: polygon
    length: 0.96
    width: 0.55
    margin: 0.10
  sensor_mount:
    parent: odin1_base_link
    child: base_link
    x: -0.42
    y: 0.0
    z: 0.12
    yaw: 0.0
  supports_strafe: true

bridge:
  common:
    cmd_vel_topic: /cmd_vel
    max_linear_vel: 1.0
    max_angular_vel: 1.0
    cmd_vel_timeout: 0.5
  ros2:
    package: sw01_ros_control
    launch: sw01_control.launch.py
    cmd_vel_topic: /cmd_vel
    auto_enter_move_mode: true
  native:
    control_rate: 50.0
    heartbeat_rate: 10.0
    cmd_vel_decay_window: 0.0
    sdk_timeout: 10000
    auth_timeout: 2000
    move_timeout: 20
    heartbeat_timeout: 20
    request_control_authority: true
    require_move_mode: true
    publish_status: true

navigation:
  inflation_radius: 0.35
  obstacle_cost_safe_distance: 0.80
  obstacle_cost_weight: 8.0
  line_of_sight_safe_distance: 0.35
  smoothing_iterations: 40
  smoothing_max_deviation_m: 0.35
  min_height: -0.3
  max_height: 0.3
  local_planner: neupan
  navigation_mode: replan_periodic
  periodic_replan_sec: 2.0

mission:
  enable_alignment: true
  angular_tolerance: 0.3491
  route_segment_enable: true
  route_segment_length_m: 10.0
  route_segment_overlap_m: 3.0

global_planner:
  backend: map_planner
  backends:
    map_planner:
      plan_service: /map_planner/plan

local_planner:
  backend: neupan
  backends:
    neupan:
      interface:
        mode: action
        path_topic: /initial_path
        scan_topic: /scan_360
        odom_topic: /odin1/odometry
        cmd_vel_topic: /cmd_vel
        nav_path_action: /neupan/nav_path
        stop_topic: /neupan/stop
      config: neupan/config.yaml
      planner: neupan/planner.yaml
