# Xuanji SW01 platform ROS configuration for NeuPAN.

planner_config_file: "planner.yaml"
dune_checkpoint: "example/dune_train/model/sw01/model_5000.pth"

refresh_initial_path: True
flip_angle: False
include_initial_path_direction: False

frame:
  map: "map"
  base: "base_link"
  lidar: "odin1_base_link"


topic:
  scan: "/scan_360"   # Synthetic 360-degree scan from sliding_map with footprint filtering and memory
  cmd_vel: "/cmd_vel"
  path: "/initial_path"
  waypoints: "/waypoints"
  goal: "/neupan/goal"
  arrive: "/neupan/arrive"
  replan: "/neupan/replan"
  odom: "/odin1/odometry"


odom_feedback:
  enable: false
  stale_threshold_sec: 0.2
  # false: rotate world-frame twist.linear into body frame using pose yaw;
  # true: twist.linear is already in body frame.
  linear_is_body_frame: false


smith_predictor:
  enable: false
  fixed_lag_sec: 0.10
  use_solve_time: true
  max_tau_sec: 0.25
  velocity_source: "odom"


output_gain:
  enable: false
  w_gain: 1.16
  v_fwd_gain: 0.87
  v_bwd_gain: 1.16
scan_range: [0.2, 4.5]
scan_angle: [-3.14, 3.14]
scan_downsample: 1

marker_size: 0.05
marker_z: 0.3

cmd_w_lpf_alpha: 0.0


# Gated hysteresis deadband on angular velocity during clean straight-line tracking.
w_deadband:
  enable: true
  enter_rad: 0.03
  exit_rad: 0.067
  straight_heading_err_max_deg: 8.0
  straight_curvature_max: 0.15
  straight_obstacle_min_dist_m: 0.9
  straight_lookahead_m: 1.0

curvature_speed:
  enable: false
  a_lat_max: 0.5
  v_min: 0.3
  lookahead_sec: 1.0
  lp_alpha: 0.2

adaptive_d_max:
  enable: false
  min: 0.10
  max: 0.30
  safety_margin: 0.05
  forward_window_m: 2.0
  lateral_window_m: 2.0
  update_period_sec: 0.5
  frontal_exclude_scale: 0.8
  forward_slices: 4
  min_populated_slices: 2
  clearance_percentile: 10.0
  shrink_confirmations: 2
  guard_min_dist_m: 0.05
  guard_frames: 3
  guard_cooldown_sec: 5.0


recovery_contract:
  shadow_enable: false
  behavior_enable: false
  request_count: 5
  side_min_clearance: 0.57
  retry_sec: 0.2

stuck_escape:
  enable: true
  criterion: progress
  displacement_window_sec: 1.0
  displacement_threshold_m: 0.05
  progress_threshold_m: 0.05
  v_eps: 0.15
  w_eps: 0.30
  trigger_frames: 10
  front_obs_threshold: 1.0
  cone_half_width_rad: 0.9
  back_speed: 0.15
  rotate_speed: 0.5
  rotate_gate_enable: true
  rotate_clearance_m: 0.85
  rotate_bounded_enable: true
  rotate_open_enable: true
  rotate_open_clearance_m: 0.57
  rotate_bounded_margin_m: 0.05
  oscillation_detect_enable: true
  osc_window_sec: 4.0
  osc_net_disp_m: 0.30
  osc_travel_m: 0.5
  duration_sec: 2.4
  exit_obs_distance: 1.3
  side_search_radius_m: 3.5
  limit_cycle_consecutive_n: 3
  limit_cycle_window_sec: 20.0
  min_rotation_rad: 0.35
  # Lateral strafe escape mode
  strafe_enable: true
  strafe_speed: 0.40
  strafe_duration_sec: 4.0
  strafe_direction_sign: 1.0
  strafe_side_margin_m: 0.10
  corridor_guard_enable: true
  corridor_side_max_m: 1.2
  corridor_forward_window_m: 2.0
  corridor_slices: 4
  corridor_min_slices: 2
  corridor_symmetry_ratio: 2.0
  corridor_standstill_disp_m: 0.02
  corridor_standstill_sec: 3.0

  early_replan_enable: false
  early_replan_trigger_frames: 5
  early_replan_cooldown_sec: 2.0

  post_escape_grace_q_theta_scale: 0.25
  post_escape_grace_q_s_scale: 0.5
  post_escape_grace_min_distance_m: 0.5
  post_escape_grace_clear_threshold_m: 1.0
  post_escape_grace_clear_dwell_sec: 0.5
  post_escape_grace_max_sec: 1.0

  path_block_grace_enable: true
  path_block_dist_m: 0.80
  path_block_frames: 5
  path_block_clear_frames: 10

# Dynamic follow target obstacle masking (disabled by default)
follow_target:
  enable: false
  topic: "/waypoint_manager/follow_target"
  stale_sec: 2.0
  suspend_escape: true
