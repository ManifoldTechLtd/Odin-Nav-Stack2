# Unitree Go2 NeuPAN planner configuration.

# mpc
receding: 10
step_time: 0.1
ref_speed: 0.625
device: 'cpu'
time_print: False
collision_threshold: 0.05

# robot
robot:
  kinematics: 'diff'
  max_speed: [0.625, 0.875]
  max_acce: [0.625, 0.875]
  length: 0.7
  width: 0.35

# initial path
ipath:
  interval: 0.1
  waypoints: []
  curve_style: 'line'   # 'dubins' or reeds or line
  min_radius: 0.2
  loop: False
  # Relaxed arrival threshold (0.45m) so Go2's minimum turning radius does not
  # cause orbiting near the goal; final alignment is handled by /atomic_move/align.
  arrive_threshold: 0.45
  close_threshold: 0.1
  ind_range: 30
  arrive_index_threshold: 1
  
# proximal alternating minimization network
pan:
  iter_num: 2
  dune_max_num: 100
  nrmp_max_num: 10
  iter_threshold: 0.1
  dune_checkpoint: 'example/dune_train/model/go2/model_5000.pth'
  # Analytical closed-form DUNE solution replaces per-point MLP inference (~10x speedup)
  dune_use_analytic: true


# adjust parameters
adjust:
  solver: 'SCS'
  q_s: 1.0
  q_theta: 2.0
  p_u: 1.0
  p_w: 0.8
  p_w_cross: 0.0
  eta: 9.0
  ro_obs: 400
  d_max: 0.10
  d_min: 0.02
  bk: 0.4
  nrmp_inference_only: true
  nrmp_warm_start: true

