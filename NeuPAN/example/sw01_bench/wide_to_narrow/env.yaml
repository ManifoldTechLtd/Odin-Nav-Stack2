world:
  height: 6
  width: 20
  step_time: 0.1
  sample_time: 0.1
  offset: [0, -3]
  collision_mode: 'stop'
  control_mode: 'auto'

# Benchmark scene: wide (1.8m) to narrow (0.8m) transition corridor
robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'rectangle', length: 0.96, width: 0.55}
    state: [-1, 0, 0]
    goal: [13, 0, 0]
    vel_min: [-1.0, -3.14]
    vel_max: [1.0, 3.14]
    goal_threshold: 0.25
    plot:
      show_trail: True
      show_goal: False
      show_trajectory: False
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 8
        angle_range: 2.094
        number: 200
        noise: False

obstacle:
  - number: 4
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 8, width: 0.4}
      - {name: 'rectangle', length: 8, width: 0.4}
      - {name: 'rectangle', length: 7, width: 0.4}
      - {name: 'rectangle', length: 7, width: 0.4}
    state: [[3, -1.1, 0], [3, 1.1, 0], [10, -0.6, 0], [10, 0.6, 0]]
