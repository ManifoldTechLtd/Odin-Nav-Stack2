world:
  height: 8
  width: 25
  step_time: 0.1
  sample_time: 0.1
  offset: [0, -4]
  collision_mode: 'stop'
  control_mode: 'auto'

# Benchmark scene: head-on approaching dynamic obstacle at 1.5 m/s
robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'rectangle', length: 0.96, width: 0.55}
    state: [0, 0, 0]
    goal: [22, 0, 0]
    vel_min: [-1.0, -3.14]
    vel_max: [1.0, 3.14]
    goal_threshold: 0.25
    plot:
      show_trail: True
      show_goal: False
      show_trajectory: False
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 8
        angle_range: 2.094
        number: 200
        noise: False

obstacle:
  - number: 1
    distribution: {name: 'manual'}
    shape:
      - {name: 'circle', radius: 0.3}
    state: [[20, 0, 3.14]]
    goal: [[-2, 0, 0]]
    kinematics: {name: 'diff'}
    behavior:
      - {name: 'dash'}
    vel_min: [-1.5, -3.14]
    vel_max: [1.5, 3.14]
    arrive_mode: position
    goal_threshold: 0.3
    plot:
      show_goal: False
      show_arrow: True
