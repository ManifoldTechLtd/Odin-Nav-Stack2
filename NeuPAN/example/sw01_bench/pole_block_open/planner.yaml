# Xuanji SW01 NeuPAN planner configuration (benchmark scene: pole_block_open).

# mpc
receding: 8
step_time: 0.1
ref_speed: 0.8
device: 'cpu'
time_print: False
collision_threshold: 0.02

# robot
robot:
  kinematics: 'diff'
  max_speed: [1.0, 1.0]
  max_acce: [0.5, 0.5]
  length: 0.96
  width: 0.55

# initial path
ipath:
  interval: 0.1
  waypoints: []
  curve_style: 'line'
  min_radius: 0.2
  loop: False
  arrive_threshold: 0.25
  close_threshold: 0.1
  ind_range: 30
  arrive_index_threshold: 1

# proximal alternating minimization network
pan:
  iter_num: 2
  dune_max_num: 50
  nrmp_max_num: 10
  iter_threshold: 0.1
  dune_checkpoint: 'example/dune_train/model/sw01/model_5000.pth'
  dune_use_analytic: true

# adjust parameters
adjust:
  solver: 'SCS'
  q_s: 3.0
  q_theta: 1.0
  p_u: 1.0
  p_w: 0.8
  p_w_cross: 0.0
  eta: 12.0
  ro_obs: 400
  d_max: 0.4
  d_min: 0.05
  nrmp_inference_only: true
  nrmp_warm_start: true
  bk: 0.4
