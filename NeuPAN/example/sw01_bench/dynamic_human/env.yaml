world:
  height: 8
  width: 25
  step_time: 0.1
  sample_time: 0.1
  offset: [0, -4]
  collision_mode: 'stop'
  control_mode: 'auto'

# Benchmark scene: dynamic pedestrians crossing the path
robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'rectangle', length: 0.96, width: 0.55}
    state: [0, 0, 0]
    goal: [22, 0, 0]
    vel_min: [-0.8, -3.14]
    vel_max: [0.8, 3.14]
    goal_threshold: 0.25
    plot:
      show_trail: True
      show_goal: False
      show_trajectory: False
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 8
        angle_range: 2.094  # 120 deg horizontal FOV
        number: 200
        noise: False

obstacle:
  - number: 3
    distribution: {name: 'manual'}
    shape:
      - {name: 'circle', radius: 0.25}
      - {name: 'circle', radius: 0.25}
      - {name: 'circle', radius: 0.25}
    state: [[6, 2.5, -1.57], [11, -2.5, 1.57], [16, 2.5, -1.57]]
    kinematics: {name: 'diff'}
    behavior:
      - {name: 'rvo', range_low: [4, -3, -3.14], range_high: [18, 3, 3.14], wander: True, vxmax: 0.8, vymax: 0.8}
    vel_min: [-0.8, -3.14]
    vel_max: [0.8, 3.14]
    arrive_mode: position
    goal_threshold: 0.3
    plot:
      show_goal: False
      show_arrow: True
