# SW01 benchmark - dynamic_human
receding: 10
step_time: 0.1
ref_speed: 0.4
device: 'cpu'
time_print: False
collision_threshold: 0.05

robot:
  kinematics: 'diff'
  max_speed: [0.8, 0.8]
  max_acce: [0.5, 0.5]
  length: 0.96
  width: 0.55

ipath:
  waypoints: [[22, 0, 0]]
  curve_style: 'line'
  min_radius: 0.2
  loop: False
  arrive_threshold: 0.25
  close_threshold: 0.1
  ind_range: 30
  arrive_index_threshold: 1

pan:
  iter_num: 2
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint: 'example/dune_train/model/sw01/model_5000.pth'
  iter_threshold: 0.1

adjust:
  solver: 'SCS'
  q_s: 1.0
  q_theta: 1.0
  p_u: 1.0
  p_w: 0.8
  p_w_cross: 0.0
  eta: 15.0
  ro_obs: 500
  d_max: 0.5
  d_min: 0.05
  bk: 0.4
