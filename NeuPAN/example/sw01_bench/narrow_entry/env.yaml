world:
  height: 8
  width: 20
  step_time: 0.1
  sample_time: 0.1
  offset: [-2, -4]
  collision_mode: 'stop'
  control_mode: 'auto'

# Benchmark scene: oblique entry (+25 deg yaw) into a 1.15m x 4.5m corridor
robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'rectangle', length: 0.96, width: 0.55}
    state: [0, 0, 0.44]
    goal: [12, 0, 0]
    vel_min: [-0.8, -3.14]
    vel_max: [0.8, 3.14]
    goal_threshold: 0.25
    plot:
      show_trail: True
      show_goal: False
      show_trajectory: False
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 8
        angle_range: 2.094  # 120 deg horizontal FOV
        number: 200
        noise: False

obstacle:
  - number: 2
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 4.5, width: 0.4}
      - {name: 'rectangle', length: 4.5, width: 0.4}
    state: [[6.25, 0.775, 0], [6.25, -0.775, 0]]
