# Benchmark scene: sweep_corner_open
world:
  width: 14
  height: 8
  step_time: 0.1
  sample_time: 0.1
  offset:
  - 0
  - -4
  collision_mode: stop
  control_mode: auto
robot:
- kinematics:
    name: diff
  shape:
    name: rectangle
    length: 0.96
    width: 0.55
  state:
  - 1.5
  - 0
  - 0
  goal:
  - 12
  - 0
  - 0
  vel_min:
  - -1
  - -3.14
  vel_max:
  - 1
  - 3.14
  goal_threshold: 0.25
  plot:
    show_trail: true
    show_goal: false
    show_trajectory: false
  sensors:
  - type: lidar2d
    range_min: 0
    range_max: 8
    angle_range: 2.094
    number: 200
    noise: false
obstacle:
- number: 2
  distribution:
    name: manual
  shape:
  - name: rectangle
    length: 0.5
    width: 0.1
  - name: rectangle
    length: 0.5
    width: 0.1
  state:
  - - 7.0
    - 0.52
    - 0
  - - 6.4
    - -0.52
    - 0
- number: 1
  distribution:
    name: manual
  exclude_from_static: true
  shape:
  - name: circle
    radius: 0.25
  state:
  - - 8.0
    - 0
    - 0
