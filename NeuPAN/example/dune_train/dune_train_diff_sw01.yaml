robot:
  kinematics: 'diff'
  length: 0.96   # Xuanji SW01 length (0.96m)
  width: 0.55    # Xuanji SW01 width (0.55m)


train:
  model_name: 'sw01'   # Saved under example/dune_train/model/sw01/
  direct_train: true
  data_size: 100000
  data_range: [-25, -25, 25, 25]
  batch_size: 256
  epoch: 5000
  valid_freq: 250
  save_freq: 500
  lr: 5e-5
  lr_decay: 0.5
  decay_freq: 1500
